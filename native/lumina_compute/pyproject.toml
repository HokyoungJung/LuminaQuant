[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[project]
name = "lumina_compute"
version = "0.1.0"
requires-python = ">=3.11"
description = "lumina_quant native compute island (pyo3)"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
module-name = "lumina_quant._compute"
python-source = "../../src"
features = ["pyo3/extension-module"]
