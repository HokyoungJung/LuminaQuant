[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-quant-public"
version = "0.1.0"
description = "Sanitized sample backtesting and paper-live pipeline for LuminaQuant."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LuminaQuant"}]
dependencies = ["optuna>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
lq-public = "lumina_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
