name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Public safety audit
        run: python tests/public_safety_audit.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Rust kernel tests
        run: cargo test --manifest-path native/rust_backtest_kernel/Cargo.toml
      - name: CLI smoke
        run: |
          lq-public backtest --data sample_data/sample_ohlcv.csv
          lq-public backtest --engine rust --data sample_data/sample_ohlcv.csv
          lq-public paper-live --data sample_data/sample_ohlcv.csv
          lq-public optimize --method grid --data sample_data/sample_ohlcv.csv
          lq-public optimize --method optuna --data sample_data/sample_ohlcv.csv --n-trials 8 --sampler-seed 11
          lq-public backtest --config sample_configs/public_sample_pipeline.toml
          lq-public paper-live --config sample_configs/public_sample_pipeline.toml
          lq-public optimize --config sample_configs/public_sample_pipeline.toml --fast-grid 2,3 --slow-grid 6,8
